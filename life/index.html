<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game of Life</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --cell: #3fb950;
      --grid: #21262d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    #controls label {
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    #controls input[type="range"] {
      width: 100px;
      accent-color: var(--accent);
    }
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .btn:hover {
      background: var(--border);
      border-color: var(--text-muted);
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    #canvas-wrap {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="controls">
    <button id="btn-random" class="btn">Random</button>
    <button id="btn-clear" class="btn">Clear</button>
    <button id="btn-step" class="btn">Step</button>
    <button id="btn-run" class="btn primary">Start</button>
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="1" max="20" value="8">
    <span id="speed-label">8</span> gen/s
  </div>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
  <script type="text/javascript" src="main.js"></script>
</body>
</html>
